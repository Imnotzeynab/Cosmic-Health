    <!-- MENTAL & BEHAVIORAL PAGE -->

    <main class="health-page">


        <!-- PAGE HEADING -->

        <div class="health-heading">

            <p class="small-title">
                HEALTH INDICATOR 05
            </p>

            <h1>
                MENTAL <span>&amp; BEHAVIORAL</span>
            </h1>

            <p class="instruction">
                Select any mental, emotional, or behavioral changes you have noticed.
            </p>

        </div>


        <!-- INDICATORS -->

        <div class="indicators">


            <!-- 01 -->

            <button
                class="indicator-card"
                data-symptom="Stress"
            >

                <span class="indicator-number">
                    01
                </span>

                <div class="indicator-info">

                    <h2>
                        Stress
                    </h2>

                    <p>
                        Increased psychological or mission-related stress.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 02 -->

            <button
                class="indicator-card"
                data-symptom="Anxiety / Worry"
            >

                <span class="indicator-number">
                    02
                </span>

                <div class="indicator-info">

                    <h2>
                        Anxiety / Worry
                    </h2>

                    <p>
                        Increased nervousness, worry, or persistent apprehension.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 03 -->

            <button
                class="indicator-card"
                data-symptom="Low Mood"
            >

                <span class="indicator-number">
                    03
                </span>

                <div class="indicator-info">

                    <h2>
                        Low Mood
                    </h2>

                    <p>
                        A noticeable decrease in mood or emotional well-being.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 04 -->

            <button
                class="indicator-card"
                data-symptom="Irritability"
            >

                <span class="indicator-number">
                    04

                <div class="indicator-info">

                    <h2>
                        Irritability

                    <p>
                        Increased frustration, annoyance, or emotional sensitivity.

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 05 -->

            <button
                class="indicator-card"
                data-symptom="Mood Changes"
            >

                <span class="indicator-number">
                    05
                </span>

                <div class="indicator-info">

                    <h2>
                        Mood Changes
                    </h2>

                    <p>
                        Noticeable changes in mood compared with your usual baseline.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 06 -->

            <button
                class="indicator-card"

                    →
                </span>

            </button>


            <!-- 07 -->

                        Memory Changes

                    →
                </span>

            </button>

                    10

                <div class="indicator-info">

                        Social Withdrawal

                        Emotional Regulation

                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 13 -->

            <button
                class="indicator-card"
                data-symptom="Restlessness"
            >

                <span class="indicator-number">
                    13
                </span>

                <div class="indicator-info">

                    <h2>
                        Restlessness

                    <p>

                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 14 -->

            <button
                class="indicator-card"
                data-symptom="Feeling Overwhelmed"
            >

                    14

                <div class="indicator-info">

                    <h2>
                        Feeling Overwhelmed

                <span class="arrow">
                    →

            <!-- 15 -->

                    <h2>
