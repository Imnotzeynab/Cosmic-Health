    <!-- CARDIOVASCULAR PAGE -->

    <main class="health-page">


        <!-- HEADING -->

        <div class="health-heading">

            <p class="small-title">
                CARDIOVASCULAR ASSESSMENT
            </p>


            <h1>
                HOW IS YOUR
                <span>HEART & CIRCULATION?</span>
            </h1>


            <p class="instruction">
                Select the cardiovascular changes or symptoms you are currently experiencing.
            </p>

        </div>



        <!-- CARDIOVASCULAR INDICATORS -->

        <section class="indicators">


            <!-- 01 -->

            <button
                class="indicator-card"
                data-symptom="Heart Rate"
            >

                <div class="indicator-number">
                    01
                </div>


                <div class="indicator-info">

                    <h2>
                        Heart Rate
                    </h2>

                    <p>
                        Unusual resting or activity heart rate
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 02 -->

            <button
                class="indicator-card"
                data-symptom="Heart Rhythm"
            >

                <div class="indicator-number">
                    02
                </div>


                <div class="indicator-info">

                    <h2>
                        Heart Rhythm
                    </h2>

                    <p>
                        Racing, fluttering or irregular heartbeat
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 03 -->

            <button
                class="indicator-card"
                data-symptom="Blood Pressure"
            >

                <div class="indicator-number">
                    03
                </div>


                <div class="indicator-info">

                    <h2>
                        Blood Pressure
                    </h2>

                    <p>
                        Unusually high or low blood pressure
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 04 -->

            <button
                class="indicator-card"
                data-symptom="Orthostatic Response"
            >

                <div class="indicator-number">
                    04
                </div>


                <div class="indicator-info">

                    <h2>
                        Orthostatic Response
                    </h2>

                    <p>
                        Dizziness or weakness when moving upright
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 05 -->

            <button
                class="indicator-card"
                data-symptom="Fainting or Near-Fainting"
            >

                <div class="indicator-number">
                    05
                </div>


                <div class="indicator-info">

                    <h2>
                        Fainting / Near-Fainting
                    </h2>

                    <p>
                        Fainting or feeling close to fainting
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 06 -->

            <button
                class="indicator-card"
                data-symptom="Chest Discomfort"
            >

                <div class="indicator-number">
                    06
                </div>


                <div class="indicator-info">

                    <h2>
                        Chest Discomfort
                    </h2>

                    <p>
                        Chest pain, pressure or tightness
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 07 -->

            <button
                class="indicator-card"
                data-symptom="Shortness of Breath"
            >

                <div class="indicator-number">
                    07
                </div>


                <div class="indicator-info">

                    <h2>
                        Shortness of Breath
                    </h2>

                    <p>
                        Unusual difficulty breathing
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 08 -->

            <button
                class="indicator-card"
                data-symptom="Exercise Capacity"
            >

                <div class="indicator-number">
                    08
                </div>


                <div class="indicator-info">

                    <h2>
                        Exercise Capacity
                    </h2>

                    <p>
                        Reduced ability to perform expected exercise
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 09 -->

            <button
                class="indicator-card"
                data-symptom="Exercise Recovery"
            >

                <div class="indicator-number">
                    09
                </div>


                <div class="indicator-info">

                    <h2>
                        Exercise Recovery
                    </h2>

                    <p>
                        Unusually slow heart-rate recovery after exercise
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 10 -->

            <button
                class="indicator-card"
                data-symptom="Fluid Shift / Swelling"
            >

                <div class="indicator-number">
                    10
                </div>


                <div class="indicator-info">

                    <h2>
                        Fluid Shift / Swelling
                    </h2>

                    <p>
                        Unusual swelling or fluid-distribution changes
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 11 -->

            <button
                class="indicator-card"
                data-symptom="Circulation"
            >

                <div class="indicator-number">
                    11
                </div>


                <div class="indicator-info">

                    <h2>
                        Circulation
                    </h2>

                    <p>
                        Unusual coldness, numbness or color changes
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>



            <!-- 12 -->

            <button
                class="indicator-card"
                data-symptom="Cardiovascular Fatigue"
            >

                <div class="indicator-number">
                    12
                </div>


                <div class="indicator-info">

                    <h2>
                        Cardiovascular Fatigue
                    </h2>

                    <p>
                        Unusual weakness or fatigue during normal activity
                    </p>

                </div>


                <span class="arrow">
                    →
                </span>

            </button>


        </section>



        <!-- SAVE -->

        <div class="center-btn">

            <a href="healthind.html" class="save-btn">
                SAVE
                <span>→</span>
            </a>

        </div>


    </main>
