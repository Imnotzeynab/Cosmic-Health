    <!-- IMMUNE / GENERAL PAGE -->

    <main class="health-page">


        <!-- PAGE HEADING -->

        <div class="health-heading">

            <p class="small-title">
                HEALTH INDICATOR 03
            </p>

            <h1>
                IMMUNE <span>/ GENERAL</span>
            </h1>

            <p class="instruction">
                Select any immune or general health changes you have noticed.
            </p>

        </div>


        <!-- INDICATORS -->

        <div class="indicators">


            <!-- 01 -->

            <button
                class="indicator-card"
                data-symptom="Fever"
            >

                <span class="indicator-number">
                    01
                </span>

                <div class="indicator-info">

                    <h2>
                        Fever
                    </h2>

                    <p>
                        Unusually high temperature or feeling unusually hot.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 02 -->

            <button
                class="indicator-card"
                data-symptom="Chills"
            >

                <span class="indicator-number">
                    02
                </span>

                <div class="indicator-info">

                    <h2>
                        Chills
                    </h2>

                    <p>
                        Shivering or feeling unusually cold.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 03 -->

            <button
                class="indicator-card"
                data-symptom="Unusual Weakness"
            >

                <span class="indicator-number">
                    03
                </span>

                <div class="indicator-info">

                    <h2>
                        Unusual Weakness
                    </h2>

                    <p>
                        A noticeable decrease in strength compared with your normal baseline.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 04 -->

            <button
                class="indicator-card"
                data-symptom="Headache"
            >

                <span class="indicator-number">
                    04
                </span>

                <div class="indicator-info">

                    <h2>
                        Headache
                    </h2>

                    <p>
                        New or unusual pain, pressure, or discomfort in the head.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 05 -->

            <button
                class="indicator-card"
                data-symptom="Body Aches"
            >

                <span class="indicator-number">
                    05
                </span>

                <div class="indicator-info">

                    <h2>
                        Body Aches
                    </h2>

                    <p>
                        General muscle or body discomfort that differs from normal.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 06 -->

            <button
                class="indicator-card"
                data-symptom="Sore Throat"
            >

                <span class="indicator-number">
                    06
                </span>

                <div class="indicator-info">

                    <h2>
                        Sore Throat
                    </h2>

                    <p>
                        Irritation, soreness, or pain in the throat.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 07 -->

            <button
                class="indicator-card"
                data-symptom="Nausea"
            >

                <span class="indicator-number">
                    07
                </span>

                <div class="indicator-info">

                    <h2>
                        Nausea
                    </h2>

                    <p>
                        Feeling sick to your stomach or like you may vomit.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 08 -->

            <button
                class="indicator-card"
                data-symptom="Unusual Fatigue"
            >

                <span class="indicator-number">
                    08
                </span>

                <div class="indicator-info">

                    <h2>
                        Unusual Fatigue
                    </h2>

                    <p>
                        Tiredness or reduced energy that is different from your normal baseline.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 09 -->

            <button
                class="indicator-card"
                data-symptom="Loss of Appetite"
            >

                <span class="indicator-number">
                    09
                </span>

                <div class="indicator-info">

                    <h2>
                        Loss of Appetite
                    </h2>

                    <p>
                        A noticeable decrease in your usual desire to eat.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 10 -->

            <button
                class="indicator-card"
                data-symptom="Swollen Lymph Nodes"
            >

                <span class="indicator-number">
                    10
                </span>

                <div class="indicator-info">

                    <h2>
                        Swollen Lymph Nodes
                    </h2>

                    <p>
                        New or noticeable swelling in areas where lymph nodes are located.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 11 -->

            <button
                class="indicator-card"
                data-symptom="Skin Changes"
            >

                <span class="indicator-number">
                    11
                </span>

                <div class="indicator-info">

                    <h2>
                        Skin Changes
                    </h2>

                    <p>
                        New rash, redness, irritation, or other unusual skin changes.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- 12 -->

            <button
                class="indicator-card"
                data-symptom="Feeling Unwell"
            >

                <span class="indicator-number">
                    12
                </span>

                <div class="indicator-info">

                    <h2>
                        Feeling Unwell
                    </h2>

                    <p>
                        A general feeling that something is different from your normal state of health.
                    </p>

                </div>

                <span class="arrow">
                    →
                </span>

            </button>


        </div>


        <!-- CONTINUE -->

        <div
            class="center-btn"
            style="margin-top: 30px;"
        >

            <a
                href="healthind.html"
                class="save-btn"
            >

                SAVE

                <span>
                    →
                </span>

            </a>

        </div>


    </main>
