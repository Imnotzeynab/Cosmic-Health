<!-- SLEEP PAGE -->

<main class="health-page">

    <div class="health-heading">

        <p class="small-title">
            HEALTH INDICATOR 06
        </p>

        <h1>
            SLEEP <span>HEALTH</span>
        </h1>

        <p class="instruction">
            Select any sleep changes or difficulties you have noticed.
        </p>

    </div>


    <!-- INDICATORS -->

    <div class="indicators">


        <button
            class="indicator-card"
            data-symptom="Difficulty Falling Asleep"
            type="button"
        >

            <span class="indicator-number">
                01
            </span>

            <div class="indicator-info">

                <h2>
                    Difficulty Falling Asleep
                </h2>

                <p>
                    Trouble getting to sleep when you intend to.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Nighttime Awakenings"
            type="button"
        >

            <span class="indicator-number">
                02
            </span>

            <div class="indicator-info">

                <h2>
                    Nighttime Awakenings
                </h2>

                <p>
                    Waking repeatedly or spending long periods awake during the night.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Early Awakening"
            type="button"
        >

            <span class="indicator-number">
                03
            </span>

            <div class="indicator-info">

                <h2>
                    Early Awakening
                </h2>

                <p>
                    Waking earlier than intended and being unable to return to sleep.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Sleep Duration"
            type="button"
        >

            <span class="indicator-number">
                04
            </span>

            <div class="indicator-info">

                <h2>
                    Sleep Duration
                </h2>

                <p>
                    Sleeping significantly more or less than your usual amount.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Poor Sleep Quality"
            type="button"
        >

            <span class="indicator-number">
                05
            </span>

            <div class="indicator-info">

                <h2>
                    Poor Sleep Quality
                </h2>

                <p>
                    Sleep that feels unrefreshing or unsatisfactory.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Restless Sleep"
            type="button"
        >

            <span class="indicator-number">
                06
            </span>

            <div class="indicator-info">

                <h2>
                    Restless Sleep
                </h2>

                <p>
                    Frequent movement, interruptions, or unsettled sleep.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Nightmares / Disturbing Dreams"
            type="button"
        >

            <span class="indicator-number">
                07
            </span>

            <div class="indicator-info">

                <h2>
                    Nightmares / Disturbing Dreams
                </h2>

                <p>
                    Dreams that disturb sleep or cause repeated awakenings.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Daytime Sleepiness"
            type="button"
        >

            <span class="indicator-number">
                08
            </span>

            <div class="indicator-info">

                <h2>
                    Daytime Sleepiness
                </h2>

                <p>
                    Unusual sleepiness or difficulty staying awake during the day.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Morning Fatigue"
            type="button"
        >

            <span class="indicator-number">
                09
            </span>

            <div class="indicator-info">

                <h2>
                    Morning Fatigue
                </h2>

                <p>
                    Waking up feeling unusually tired or unrefreshed.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Difficulty Waking Up"
            type="button"
        >

            <span class="indicator-number">
                10
            </span>

            <div class="indicator-info">

                <h2>
                    Difficulty Waking Up
                </h2>

                <p>
                    Unusual difficulty becoming fully alert after waking.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Irregular Sleep Schedule"
            type="button"
        >

            <span class="indicator-number">
                11
            </span>

            <div class="indicator-info">

                <h2>
                    Irregular Sleep Schedule
                </h2>

                <p>
                    Significant changes or inconsistency in sleep and wake times.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


        <button
            class="indicator-card"
            data-symptom="Sleep–Wake Changes"
            type="button"
        >

            <span class="indicator-number">
                12
            </span>

            <div class="indicator-info">

                <h2>
                    Sleep–Wake Changes
                </h2>

                <p>
                    Noticeable changes in your normal sleep–wake pattern.
                </p>

            </div>

            <span class="arrow">
                →
            </span>

        </button>


    </div>


    <!-- SAVE -->

    <div
        class="center-btn"
        style="margin-top: 30px;"
    >

        <a
            href="healthind.html"
            class="save-btn"
        >
            SAVE
            <span>→</span>
        </a>

    </div>


</main>

</html>
